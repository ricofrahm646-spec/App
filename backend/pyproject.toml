[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-backend"
version = "0.1.0"
description = "FastAPI orchestration backend for the JARVIS trading operating system"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg",
  "fastapi",
  "httpx",
  "jinja2",
  "orjson",
  "pydantic-settings",
  "python-multipart",
  "redis",
  "sqlalchemy",
  "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
