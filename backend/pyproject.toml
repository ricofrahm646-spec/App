[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS AI Trading OS backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29.0",
  "redis>=5.0.8",
  "httpx>=0.27.2",
  "numpy>=2.1.0",
  "pandas>=2.2.2",
  "backtrader>=1.9.78.123",
  "vectorbt>=0.26.2",
  "optuna>=3.6.1",
  "xgboost>=2.1.1",
  "torch>=2.4.1",
  "tensorflow>=2.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
